name: CI Pipeline - Todo API

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

jobs:
  test:
    name: Unit, Component & E2E Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: todo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

      rabbitmq:
        image: rabbitmq:3-management-alpine
        ports:
          - 5672:5672
          - 15672:15672
        options: >-
          --health-cmd "rabbitmq-diagnostics -q ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install dependencies
        working-directory: server/todo-api
        run: npm install

      - name: Build project
        working-directory: server/todo-api
        run: npm run build

      - name: Run Unit & Component Tests (Exercises 01 & 02)
        working-directory: server/todo-api
        run: npm test

      - name: Run E2E Tests (Exercises 03 & 04)
        working-directory: server/todo-api
        env:
          DB_HOST: localhost
          DB_PORT: 5432
          DB_USERNAME: postgres
          DB_PASSWORD: postgres
          DB_NAME: todo
          RABBITMQ_URL: amqp://guest:guest@localhost:5672
          JWT_ACCESS_SECRET: test-jwt-access-secret-32-chars-long
          JWT_REFRESH_SECRET: test-jwt-refresh-secret-32-chars-long
        run: npm run test:e2e


